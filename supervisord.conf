[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgresql]
command=/usr/lib/postgresql/15/bin/postgres -D /data/postgresql
user=postgres
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql_err.log
priority=1

[program:api]
command=npm run start:dev
directory=/app/apps/api
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/api.log
stderr_logfile=/var/log/supervisor/api_err.log
environment=DATABASE_URL="postgresql://chairboard:chairboard@localhost:5432/chairboard?schema=public"
priority=10
startsecs=5
startretries=3

[program:web]
command=npm run dev
directory=/app/apps/web
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/web.log
stderr_logfile=/var/log/supervisor/web_err.log
environment=NEXT_PUBLIC_API_URL="http://localhost:3001/api/v1"
priority=20
startsecs=5
startretries=3
